# Installed by scripts/harden-system.sh into /etc/ssh/sshd_config.d/ —
# Debian's default sshd_config Includes this directory near the top, so
# these directives win over anything set later in the main file (first
# occurrence wins for sshd_config). Password auth is kept ON deliberately
# (fail2ban covers brute-force risk) — see CLAUDE.md before changing that.
PermitRootLogin no
PasswordAuthentication yes
MaxAuthTries 4
LoginGraceTime 30
